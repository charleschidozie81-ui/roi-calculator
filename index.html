<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROI calculator for small business in nigeria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Solar ROI Calculator For Small Business</h1>
  <p>All amounts are in naira.</p>

<div class="field">
  <label for="systemCost">Cost of the solar system (₦)</label>
  <input type="number" id="systemCost" min="0" placeholder="e.g. 900000">
</div>
  <div class="field">
  <label for="installCost">Installation and other one-off costs (₦)</label>
  <input type="number" id="installCost" min="0" placeholder="e.g. 100000">
  </div>
  <div class="field">
  <label for="runningCost">Running cost per month (₦)</label>
  <input type="number" id="runningCost" min="0" placeholder="e.g. 20000">
  </div>
  <div class="field">
  <label for="monthlySaving">Money saved each month (₦)</label>
  <input type="number" id="monthlySaving" min="0" placeholder="e.g. 240000">
  </div>

  <div class="field">
  <label for="months">Months to measure over</label>
  <select id="months">
    <option value="12">12 months</option>
    <option value="24" selected>24 months</option>
    <option value="36">36 months</option>
  </select>
</div>

<button id="calculateBtn">Check my payback</button>

<p id="errorMessage"></p>

<div class="results">
  <p>Total cost: <strong id="totalCost"></strong></p>
  <p>Total benefit: <strong id="totalBenefit"></strong></p>
  <p>Net gain: <strong id="netGain"></strong></p>
  <p>ROI: <strong id="roiResult"></strong></p>
  <p>Payback: <strong id="paybackResult"></strong></p>
</div>

<p id="verdictText"></p>

<script src="script.js"></script>
  




  
</body>
</html>
